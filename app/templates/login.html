{% extends "base.html" %}
{% block title %}Login – Central de Relacionamento NOVACAP{% endblock %}

{% block content %}
<section class="auth-container fade-in">

  <!-- Cabeçalho institucional -->
  <header class="auth-header">
    <h1>Central de Relacionamento</h1>
    <h2>Companhia Urbanizadora da Nova Capital do Brasil</h2>
  </header>

  <!-- Cartão de login -->
  <div class="auth-card">

    <h3 class="auth-card-title">
      <i class="fas fa-lock"></i>
      <span>Acesso ao Sistema</span>
    </h3>

    <!-- Formulário de Login -->
    <form method="POST" action="{{ url_for('main_bp.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <!-- Usuário -->
      <div class="form-group">
        <label for="username">Nome de Usuário</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" placeholder="ex: nome.sobrenome"
                 required autocomplete="username">
        </div>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-with-icon">
          <i class="fas fa-key"></i>
          <input type="password" id="password" name="password" placeholder="Digite sua senha"
                 required autocomplete="current-password">
        </div>
      </div>

      <!-- Botão principal -->
      <div style="text-align:center; margin-top:2rem;">
        <button type="submit" class="btn btn-primary" style="width:100%;">
          <i class="fas fa-sign-in-alt"></i>
          <span>Entrar no Sistema</span>
        </button>
      </div>

      <!-- Links de suporte -->
      <div class="auth-links">
        <a href="{{ url_for('main_bp.cadastro') }}">Solicitar Cadastro</a>
        <span style="margin: 0 0.5rem; color: var(--texto-muted);">•</span>
        <a href="{{ url_for('main_bp.trocar_senha') }}">Redefinir Senha</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
